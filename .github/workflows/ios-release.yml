name: iOS Release IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA for physical device
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(ls -1d /Applications/Xcode_*.app | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error ::No Xcode installation found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Using Xcode: $XCODE_PATH"
          xcodebuild -version

      - name: Validate Xcode Project and Scheme
        run: |
          cd ios
          if [ ! -f Lunara.xcodeproj/project.pbxproj ]; then
            echo "::error ::Xcode project file is missing: ios/Lunara.xcodeproj/project.pbxproj"
            exit 1
          fi
          if ! xcodebuild -project Lunara.xcodeproj -scheme Lunara -showsdestinations 2>&1 | grep -q "generic/platform=iOS"; then
            echo "::error ::Scheme 'Lunara' is unavailable or does not support generic/platform=iOS"
            exit 1
          fi
          echo "Xcode project and scheme 'Lunara' validated"

      - name: Build iOS App for Physical Device (Release)
        run: |
          cd ios
          xcodebuild -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData \
            2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error ::iOS Release build for iphoneos failed"
            cat build.log
            exit 1
          fi
          echo "iOS Release build succeeded (iphoneos, unsigned, device architecture)"

      - name: Locate Built .app Bundle
        run: |
          cd ios
          APP_PATH=$(find build/DerivedData -name "Lunara.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error ::Lunara.app bundle was not produced by the build"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify .app Bundle Identifier and Executable
        run: |
          cd ios
          if [ -z "$APP_PATH" ]; then
            echo "::error ::APP_PATH was not set"
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "::error ::App bundle not found at: $APP_PATH"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          if [ "$BUNDLE_ID" != "com.lunara.app.ios" ]; then
            echo "::error ::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi
          if [ ! -x "$APP_PATH/$EXECUTABLE" ]; then
            echo "::error ::Executable is missing or not executable: $APP_PATH/$EXECUTABLE"
            exit 1
          fi
          echo ".app bundle verified"

      - name: Package .app into Unsigned .ipa
        run: |
          cd ios
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -r "$APP_PATH" Payload/Lunara.app
          if [ ! -d "Payload/Lunara.app" ]; then
            echo "::error ::Payload/Lunara.app was not created"
            exit 1
          fi
          zip -r dist/Lunara.ipa Payload/
          ls -la dist/Lunara.ipa
          echo "IPA packaged at ios/dist/Lunara.ipa"

      - name: Validate IPA Structure
        run: |
          cd ios
          if [ ! -f dist/Lunara.ipa ]; then
            echo "::error ::IPA file was not created"
            exit 1
          fi
          if ! unzip -l dist/Lunara.ipa | grep -q "Payload/Lunara.app/Info.plist"; then
            echo "::error ::IPA is missing Payload/Lunara.app/Info.plist"
            exit 1
          fi
          if ! unzip -l dist/Lunara.ipa | grep -q "Payload/Lunara.app/Lunara$"; then
            echo "::error ::IPA is missing the Lunara executable inside Payload/Lunara.app"
            exit 1
          fi
          echo "IPA structure validated: Payload/Lunara.app present with Info.plist and executable"

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/dist/Lunara.ipa
          retention-days: 30

      - name: Publish GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lunara ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ios/dist/Lunara.ipa
