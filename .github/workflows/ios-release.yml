name: iOS Release IPA

on:
  push:
    branches: [ master, main ]
    tags: [ 'ios-*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA for physical device
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(ls -1d /Applications/Xcode_*.app | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error ::No Xcode installation found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "XCODE_PATH=$XCODE_PATH" >> "$GITHUB_ENV"
          echo "Using Xcode: $XCODE_PATH"
          xcodebuild -version

      - name: Validate Xcode Project and Scheme
        run: |
          cd ios
          if [ ! -f Lunara.xcodeproj/project.pbxproj ]; then
            echo "::error ::Xcode project file is missing: ios/Lunara.xcodeproj/project.pbxproj"
            exit 1
          fi
          if [ ! -f Lunara.xcodeproj/xcshareddata/xcschemes/Lunara.xcscheme ]; then
            echo "::error ::Shared scheme 'Lunara.xcscheme' is missing"
            exit 1
          fi
          echo "Available schemes and targets:"
          set +e
          SCHEME_LIST=$(xcodebuild -project Lunara.xcodeproj -list 2>&1)
          SCHEME_STATUS=$?
          set -e
          if [ $SCHEME_STATUS -ne 0 ]; then
            echo "::error ::xcodebuild -list failed for project 'Lunara.xcodeproj'"
            echo "::error ::$SCHEME_LIST"
            exit 1
          fi
          echo "$SCHEME_LIST"
          if ! printf '%s\n' "$SCHEME_LIST" | grep -qE "\bLunara\b"; then
            echo "::error ::Scheme 'Lunara' not found in project"
            exit 1
          fi
          echo "Xcode project and scheme 'Lunara' validated"

      - name: Build iOS App for Device (Release)
        run: |
          cd ios
          set +e
          BUILD_OUTPUT=$(xcodebuild -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath "$RUNNER_TEMP/LunaraBuild" 2>&1)
          BUILD_STATUS=$?
          set -e
          printf '%s\n' "$BUILD_OUTPUT" | tee build.log
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error ::iOS Release build for iphoneos failed (exit $BUILD_STATUS)"
            echo "::group::Swift Compiler Errors"
            printf '%s\n' "$BUILD_OUTPUT" | grep -E "error:" || true
            echo "::endgroup::"
            echo "::group::Full Build Log"
            printf '%s\n' "$BUILD_OUTPUT"
            echo "::endgroup::"
            exit 1
          fi
          echo "iOS Release build succeeded (iphoneos, unsigned, device architecture)"

      - name: Locate Built .app Bundle
        run: |
          APP_PATH="$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos/Lunara.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error ::Lunara.app bundle was not produced at expected path: $APP_PATH"
            echo "::error ::Available products:"
            find "$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos" -name "*.app" -type d 2>/dev/null || echo "  (none found)"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

      - name: Verify .app Bundle Identifier and Executable
        run: |
          APP_PATH="$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos/Lunara.app"
          if [ -z "$APP_PATH" ]; then
            echo "::error ::APP_PATH was not set"
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "::error ::App bundle not found at: $APP_PATH"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"
          if [ "$BUNDLE_ID" != "com.lunara.app.ios" ]; then
            echo "::error ::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi
          if [ ! -x "$APP_PATH/$EXECUTABLE" ]; then
            echo "::error ::Executable is missing or not executable: $APP_PATH/$EXECUTABLE"
            exit 1
          fi
          echo ".app bundle verified"

      - name: Validate .app Architecture (iPhoneOS device)
        run: |
          APP_PATH="$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos/Lunara.app"
          if [ -z "$APP_PATH" ]; then
            echo "::error ::APP_PATH was not set"
            exit 1
          fi
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          echo "Executable path: $EXECUTABLE_PATH"
          if [ ! -f "$EXECUTABLE_PATH" ]; then
            echo "::error ::Executable not found: $EXECUTABLE_PATH"
            exit 1
          fi
          echo "Architecture info:"
          file "$EXECUTABLE_PATH"
          echo "lipo info:"
          lipo -info "$EXECUTABLE_PATH" || true
          if file "$EXECUTABLE_PATH" | grep -qi "i386\|x86_64"; then
            echo "::error ::Executable contains simulator-only architecture (x86_64/i386). This is a simulator build, not a device build."
            exit 1
          fi
          if ! file "$EXECUTABLE_PATH" | grep -qi "arm64\|Mach-O"; then
            echo "::error ::Executable does not appear to be an iPhoneOS device binary."
            exit 1
          fi
          echo ".app architecture validated: device binary"

      - name: Generate Build Information
        run: |
          APP_PATH="$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos/Lunara.app"
          if [ -z "$APP_PATH" ]; then
            echo "::error ::APP_PATH was not set"
            exit 1
          fi
          APP_NAME="Lunara"
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#ios-}"
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IPA_FILENAME="Lunara-iOS-${VERSION}.ipa"

          mkdir -p dist
          cat > dist/build-info.txt << EOF
          Application: $APP_NAME
          Version: $VERSION
          Build Number: $BUILD
          Bundle Identifier: $BUNDLE_ID
          Git Commit SHA: $COMMIT_SHA
          Xcode Version: $XCODE_VERSION
          Build Date: $BUILD_DATE
          IPA Filename: $IPA_FILENAME
          EOF

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cat dist/build-info.txt

      - name: Package .app into Unsigned .ipa
        run: |
          cd ios
          APP_PATH="$RUNNER_TEMP/LunaraBuild/Build/Products/Release-iphoneos/Lunara.app"
          IPA_FILENAME="Lunara-iOS-${APP_VERSION}.ipa"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -r "$APP_PATH" Payload/Lunara.app
          if [ ! -d "Payload/Lunara.app" ]; then
            echo "::error ::Payload/Lunara.app was not created"
            exit 1
          fi
          zip -r "dist/${IPA_FILENAME}" Payload/
          ls -la "dist/${IPA_FILENAME}"
          echo "IPA packaged at ios/dist/${IPA_FILENAME}"
          echo "IPA_PATH=ios/dist/${IPA_FILENAME}" >> "$GITHUB_ENV"

      - name: Validate IPA Structure
        run: |
          cd ios
          IPA_VERSION="${APP_VERSION}"
          IPA_FILENAME="Lunara-iOS-${IPA_VERSION}.ipa"
          IPA_FILE="dist/${IPA_FILENAME}"
          if [ ! -f "$IPA_FILE" ]; then
            echo "::error ::IPA file was not created: $IPA_FILE"
            exit 1
          fi
          IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat -c%s "$IPA_FILE")
          echo "IPA size: $IPA_SIZE bytes"
          if [ "$IPA_SIZE" -eq 0 ]; then
            echo "::error ::IPA file is empty"
            exit 1
          fi
          echo "Checking ZIP integrity..."
          if ! unzip -t "$IPA_FILE" > /dev/null 2>&1; then
            echo "::error ::IPA ZIP integrity check failed"
            exit 1
          fi
          echo "ZIP integrity passed"
          echo "Checking Payload/Lunara.app exists..."
          if ! unzip -l "$IPA_FILE" | grep -q "Payload/Lunara.app/Info.plist"; then
            echo "::error ::IPA is missing Payload/Lunara.app/Info.plist"
            exit 1
          fi
          if ! unzip -l "$IPA_FILE" | grep -q "Payload/Lunara.app/Lunara$"; then
            echo "::error ::IPA is missing the Lunara executable inside Payload/Lunara.app"
            exit 1
          fi
          echo "IPA structure validated"

      - name: Extract Swift Compiler Errors on Failure
        if: failure()
        run: |
          cd ios
          if [ -f build.log ]; then
            echo "::group::Swift Compiler Errors from build.log"
            grep -E "error:" build.log || echo "No explicit 'error:' lines found"
            echo "::endgroup::"
            echo "::group::Full Build Log"
            cat build.log
            echo "::endgroup::"
          fi

      - name: Upload Diagnostic Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ios/build.log
          retention-days: 30

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/dist/Lunara-iOS-*.ipa
          retention-days: 30

      - name: Upload Build Information
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-info
          path: dist/build-info.txt
          retention-days: 30

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/ios-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#ios-}"
          IPA_FILE="ios/dist/Lunara-iOS-${VERSION}.ipa"
          BUILD_INFO="dist/build-info.txt"

          if [ ! -f "$IPA_FILE" ]; then
            echo "::error ::IPA file not found: $IPA_FILE"
            ls -la ios/dist/
            exit 1
          fi

          if ! gh release view "$TAG_NAME" --json tagName -q '.tagName' 2>/dev/null | grep -q "$TAG_NAME"; then
            RELEASE_NOTES="Lunara iOS Release ${VERSION}

            Built from commit: $(git rev-parse --short HEAD)
            Build date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

            $(cat "$BUILD_INFO")"

            gh release create "$TAG_NAME" \
              --title "Lunara iOS ${VERSION}" \
              --notes "$RELEASE_NOTES" \
              "$IPA_FILE"
          else
            echo "Release $TAG_NAME already exists. Skipping creation."
          fi

          echo "Release asset: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
