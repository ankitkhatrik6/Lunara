name: Build iOS IPA and Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties || true
          cat local.properties

      - name: Build Android APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: List Xcode schemes and targets
        run: |
          cd ios
          xcodebuild -list -project Lunara.xcodeproj

      - name: List iOS source files
        run: |
          cd ios/Lunara
          find . -name "*.swift" -type f | sort

      - name: Build iOS App (compile check)
        run: |
          cd ios
          xcodebuild build \
            -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive iOS App
        run: |
          cd ios
          xcodebuild archive \
            -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lunara.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/Lunara.xcarchive/Products/Applications/Lunara.app build/Payload/
          cd build
          zip -r Lunara.ipa Payload
          ls -la Lunara.ipa

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/build/Lunara.ipa
          retention-days: 14
