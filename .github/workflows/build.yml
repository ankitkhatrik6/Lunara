name: Build iOS IPA and Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android platform and build tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Android APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: List Xcode schemes and targets
        run: |
          cd ios
          xcodebuild -list -project Lunara.xcodeproj

      - name: List iOS source files
        run: |
          cd ios/Lunara
          find . -name "*.swift" -type f | sort

      - name: Build iOS App (unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -allowProvisioningUpdates

      - name: Create .ipa from built .app
        run: |
          cd ios
          BUILD_PATH=$(find build/Release-iphoneos -name "Lunara.app" -type d | head -1)
          echo "Found app at: $BUILD_PATH"
          mkdir -p Payload
          cp -r "$BUILD_PATH" Payload/
          zip -r Lunara.ipa Payload
          ls -la Lunara.ipa

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/Lunara.ipa
          retention-days: 14
