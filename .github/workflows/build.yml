name: Build iOS IPA and Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK (Debug)
        run: |
          ./gradlew assembleDebug

      - name: Build Android APK (Release)
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_STORE_FILE" ]; then
            echo "$RELEASE_STORE_FILE" | base64 -d > app/release-keystore.jks
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file=app/release-keystore.jks -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build and Archive iOS App (Unsigned for Sideloading)
        run: |
          cd ios
          xcodebuild archive \
            -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lunara.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/Lunara.xcarchive/Products/Applications/Lunara.app build/Payload/
          cd build
          zip -r Lunara.ipa Payload
          ls -la Lunara.ipa

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/build/Lunara.ipa
          retention-days: 14
