name: Build iOS IPA and Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Gradle wrapper works
        run: |
          ./gradlew --version

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk-bundle" >> local.properties || true
          cat local.properties

      - name: Build Android APK (Debug)
        run: |
          ./gradlew :app:assembleDebug

      - name: Upload Android APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: List Xcode schemes and targets
        run: |
          cd ios
          xcodebuild -list -project Lunara.xcodeproj

      - name: List iOS source files
        run: |
          cd ios/Lunara
          find . -name "*.swift" -type f | sort

      - name: Build iOS App (unsigned, no code signing)
        run: |
          cd ios
          xcodebuild build \
            -project Lunara.xcodeproj \
            -scheme Lunara \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Find and create .ipa
        run: |
          cd ios
          APP_PATH=$(find build -name "Lunara.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, searching in DerivedData..."
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Lunara.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Lunara.ipa Payload
            ls -la Lunara.ipa
          else
            echo "ERROR: No Lunara.app found"
            exit 1
          fi

      - name: Upload iOS IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunara-iOS-IPA
          path: ios/Lunara.ipa
          retention-days: 14
